# Runs the LiteLLM router on the HOST. Sandboxes launched with this kit
# reach it at host.docker.internal:4000 (see spec.yaml).
#
#   cp .env.example .env   # then fill in provider keys
#   docker compose up -d
#
# Then launch a sandbox:  sbx run --kit ./ claude
#
# LITELLM_IMAGE selects the image. Defaults to the public berriai image.
# To use the Docker Hardened Image (DHI), mirror it into your org and set
# LITELLM_IMAGE=<your-org>/litellm:1 in .env (the stable DHI tag runs as
# nonroot UID 65532; the config below is world-readable so it can be read).
services:
  litellm:
    image: "${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}"
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--telemetry", "False"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      # Virtual key the sandbox authenticates with (must match the kit's
      # LITELLM_MASTER_KEY / OPENAI_API_KEY). Not a provider secret.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-sandbox-litellm}"
      # Real provider credentials — supplied from the host environment.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    extra_hosts:
      # Lets the router reach Docker Model Runner on the host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# Runs the LiteLLM router on the HOST. Sandboxes launched with this kit
# reach it at host.docker.internal:4000 (see spec.yaml).
#
#   export OPENAI_API_KEY=...  ANTHROPIC_API_KEY=...  GEMINI_API_KEY=...
#   docker compose up -d
#
# Then launch a sandbox:  sbx run --kit ./ claude
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--telemetry", "False"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      # Virtual key the sandbox authenticates with (must match the kit's
      # LITELLM_MASTER_KEY / OPENAI_API_KEY). Not a provider secret.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-sandbox-litellm}"
      # Real provider credentials — supplied from the host environment.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    extra_hosts:
      # Lets the router reach Docker Model Runner on the host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

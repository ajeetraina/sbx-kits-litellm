schemaVersion: "2"
kind: mixin
name: litellm
displayName: LiteLLM Gateway (host router)
description: "Points the sandbox agent at a LiteLLM proxy running on the host at host.docker.internal:4000, giving the agent one OpenAI-compatible endpoint with routing, fallbacks, and spend tracking across OpenAI, Anthropic, Gemini, and local Docker Model Runner. The router runs on the host (like Docker Model Runner); the sandbox reaches it over host.docker.internal via an explicit network allow, and holds only a virtual key — real provider credentials never enter the sandbox."

caps:
  network:
    # The router runs on the HOST. The sandbox only needs to reach it over
    # host.docker.internal:4000 (same pattern as Docker Model Runner). All
    # upstream cloud/DMR calls are made by the host router, so no provider
    # hostnames are allowed inside the sandbox.
    allow:
      - host.docker.internal:4000

environment:
  variables:
    # Point OpenAI-compatible tooling inside the sandbox at the host router
    OPENAI_BASE_URL: "http://host.docker.internal:4000/v1"
    # Virtual key handed to the agent; maps to the router's master key.
    # Not a provider secret — real keys live only on the host router.
    OPENAI_API_KEY: "sk-sandbox-litellm"
    LITELLM_MASTER_KEY: "sk-sandbox-litellm"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

agentContext: |
  ## LiteLLM gateway (host router)

  A LiteLLM proxy runs on the host and is reachable from this sandbox at
  `http://host.docker.internal:4000/v1` (exposed via `OPENAI_BASE_URL`).
  It is OpenAI-compatible and exposes these model names: `gpt-4o`,
  `claude`, `gemini`, `local-gemma`. Authenticate with the key in
  `$LITELLM_MASTER_KEY`.

  You do NOT start or manage the gateway from inside the sandbox — it runs
  on the host. Real provider credentials live only on the host router; the
  key inside the sandbox is a virtual key. Never ask for or handle real
  API keys.

  To check the gateway is up, use `GET /health/liveliness` (returns
  `I'm alive!`) or `GET /v1/models`. If it is unreachable, the host router
  is not running — that is a host-side concern, not something to fix from
  inside the sandbox.
